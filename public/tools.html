<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Toolkit Pro free online tools.">
  <title>Tools — Toolkit Pro</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .workspace{padding:42px 0 70px}.workspace-head{margin-bottom:24px}
    .tool-layout{display:grid;grid-template-columns:260px 1fr;gap:18px}
    .tool-list,.tool-panel{border:1px solid var(--border);border-radius:16px;background:var(--surface)}
    .tool-list{padding:10px;height:max-content}.tool-btn{display:block;width:100%;padding:12px 14px;margin:2px 0;border:0;border-radius:10px;background:transparent;color:var(--text);text-align:left;cursor:pointer}.tool-btn:hover,.tool-btn.active{background:var(--surface-2)}
    .tool-panel{padding:24px;min-height:420px}.tool-panel h2{margin-top:0}.field{display:grid;gap:8px;margin:14px 0}.field label{font-weight:700}.field textarea,.field input,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}.field textarea{min-height:180px;resize:vertical}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.action{padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);cursor:pointer}.result{padding:14px;border:1px dashed var(--border);border-radius:10px;white-space:pre-wrap;word-break:break-word;background:var(--bg)}.tool-note{color:var(--muted);font-size:.9rem}
    @media(max-width:760px){.tool-layout{grid-template-columns:1fr}.tool-list{display:grid;grid-template-columns:1fr 1fr;gap:4px}.tool-btn{font-size:.88rem}}
  </style>
</head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="/"><span class="brand-mark">TP</span><span>Toolkit Pro</span></a><a class="theme-btn" href="/" aria-label="Home">⌂</a></div></header>
<main class="workspace"><div class="container">
  <div class="workspace-head"><p class="eyebrow">TOOLKIT PRO</p><h1>Online Tools</h1><p class="hero-copy" style="margin-left:0">Run useful tools directly in your browser. Your input stays on this page unless a tool explicitly needs a server API.</p></div>
  <div class="tool-layout"><nav class="tool-list" id="toolList" aria-label="Tools"></nav><section class="tool-panel" id="toolPanel"></section></div>
</div></main>
<footer class="site-footer"><div class="container footer-inner"><span>© <span id="year"></span> Toolkit Pro</span><span>Your Everyday Tool Companion</span></div></footer>
<script src="/js/tools.js" defer></script>
</body></html>
